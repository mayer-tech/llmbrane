# yaml-language-server: $schema=https://raw.githubusercontent.com/mayer-tech/llmbrane/main/config.schema.json
version: 1
server:
  listen: ":8080"
  request_timeout: 120s
  # Browser origins allowed to read responses. Omit to allow all origins;
  # use [] to disable CORS or list exact origins to restrict browser access.
  # cors:
  #   allowed_origins: ["https://app.example.com", "http://localhost:3000"]

logging:
  level: info
  # debug_dir: "./logs/debug"       # enable file-based debug logging
  # debug_retention: "24h"          # how long to keep debug log files

# Provider-side HTTP 429 retry behavior. All fields are optional; the values
# shown are the built-in defaults. Set max_retries to 0 to disable retries.
retry:
  max_retries: 6
  base_delay: 1s
  jitter: 250ms
  max_delay: 60s

aliases:
  gpt-latest: openai/gpt-5.5
  # Separate route to the Responses API; gpt-latest remains on Chat Completions.
  gpt-responses: openai/gpt-5.5-responses
  # Alias with an optional default_reasoning_effort override. It takes
  # precedence over the target model's default_reasoning_effort.
  opus:
    target: anthropic/claude-opus-5-5
    default_reasoning_effort: high
  haiku: anthropic/claude-haiku-4-5
  gemini-pro: gemini/gemini-pro-latest
  gemini-flash: gemini/gemini-flash-latest
  gemini-flash-lite: gemini/gemini-flash-lite-latest
  sonnet-aws: bedrock-direct/anthropic.claude-sonnet-4-6
  sonnet-proxy: bedrock-proxy/anthropic.claude-sonnet-4-6

providers:
  openai:
    endpoints:
      - api: "openai-chat-completions"
        url: "https://api.openai.com/v1/chat/completions"
        headers:
          Authorization: "Bearer ${OPENAI_API_KEY}"
        # Optional local TPM queue. It remains disabled unless this block is
        # configured or the provider returns a supported token-limit header.
        # rate_limit:
        #   tokens_per_minute: 200000
        #   utilization: 0.9
        #   queue_timeout: 30s
        #   output_reservation_tokens: 8192
        extensions:
          reasoning_effort_mapping:
            none: "low"
            minimal: "low"
            xhigh: "high"
            max: "high"
        models:
          gpt-5.5:
            target: gpt-5.5
            default_reasoning_effort: high
      # Use a distinct llmbrane model name so endpoint lookup cannot shadow
      # the existing Chat Completions route. Both target the same provider model.
      - api: "openai-responses"
        url: "https://api.openai.com/v1/responses"
        headers:
          Authorization: "Bearer ${OPENAI_API_KEY}"
        extensions:
          omit_params: ["temperature", "top_p"]
        models:
          gpt-5.5-responses:
            target: gpt-5.5
            default_reasoning_effort: high

  # ChatGPT authentication is connected; preview-specific request handling may
  # still affect inference compatibility.
  # openai-chatgpt:
  #   endpoints:
  #     - api: "openai-responses"
  #       url: "https://api.openai.com/v1/responses"
  #       auth:
  #         type: "chatgpt"
  #         credentials_file: "./credentials/openai-chatgpt.json"
  #         auto_discover_models: true # optional; fetches visible slugs at startup
  #       models: {}

  anthropic:
    endpoints:
      - api: "anthropic-messages"
        url: "https://api.anthropic.com/v1/messages"
        headers:
          x-api-key: "${ANTHROPIC_API_KEY}"
        # These parameters are dropped for every model on this endpoint.
        # Use a separate endpoint for models that support sampling settings.
        extensions:
          omit_params: ["temperature", "top_p"]
        models:
          claude-opus-5-5:
            target: claude-opus-5-5
            # Applied when the client omits reasoning_effort; explicit client
            # values (including "none") always win. Opus 5.5 rejects "none".
            default_reasoning_effort: medium
            # Optional output limit when the client omits one. Anthropic Messages
            # otherwise uses 16384; choose a value supported by the target model.
            # default_max_output_tokens: 16384
      # Older models may require the legacy manual thinking budget mode.
      - api: "anthropic-messages"
        url: "https://api.anthropic.com/v1/messages"
        headers:
          x-api-key: "${ANTHROPIC_API_KEY}"
        extensions:
          thinking_mode: budget
        models:
          claude-haiku-4-5:
            target: claude-haiku-4-5
            default_reasoning_effort: none

  gemini:
    endpoints:
      - api: "openai-chat-completions"
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        headers:
          Authorization: "Bearer ${GEMINI_API_KEY}"
        extensions:
          inject_thought_signature_bypass: true
        models:
          gemini-pro-latest:
            target: gemini-pro-latest
          gemini-flash-latest:
            target: gemini-flash-latest
          gemini-flash-lite-latest:
            target: gemini-flash-lite-latest

  bedrock-direct:
    endpoints:
      - api: "bedrock-converse"
        url: "https://bedrock-runtime.us-east-1.amazonaws.com/model/{target_model}/converse"
        extensions:
          aws_region: "us-east-1"
          aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
          aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
          # Optional: aws_session_token: "${AWS_SESSION_TOKEN}"
        models:
          "anthropic.claude-sonnet-4-6":
            target: "anthropic.claude-sonnet-4-6"
          "meta.llama3-3-70b-instruct-v1:0":
            target: "meta.llama3-3-70b-instruct-v1:0"

  bedrock-proxy:
    endpoints:
      - api: "bedrock-converse"
        url: "http://localhost:4000/bedrock/model/{target_model}/converse"
        headers:
          Authorization: "Bearer ${PROXY_API_KEY}"
        models:
          "anthropic.claude-sonnet-4-6":
            target: "anthropic.claude-sonnet-4-6"
